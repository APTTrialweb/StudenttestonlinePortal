<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Profile</title>

  <!-- ==========================
       INTERNAL COMBINED CSS
  =========================== -->
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #6dd5ed, #2193b0);
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .profile-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      color: white;
      width: 90%;
      max-width: 400px;
      border: 1px solid rgba(255,255,255,0.3);
      display: none;
    }

    .profile-card img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.4);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      object-fit: cover;
    }

    h2 {
      margin: 15px 0 5px;
      font-size: 24px;
    }

    #batch {
      font-size: 16px;
      margin-bottom: 20px;
      color: #e0e0e0;
    }

    .live-test-window {
      background: rgba(255, 255, 255, 0.2);
      padding: 15px;
      border-radius: 12px;
      position: relative;
      margin-bottom: 20px;
    }

    .live-test-window::before {
      content: 'LIVE';
      position: absolute;
      top: -12px;
      right: 10px;
      background: #ff3b3b;
      color: white;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .previous-tests table {
      width: 100%;
      border-collapse: collapse;
      color: white;
      font-size: 14px;
    }

    .previous-tests th, .previous-tests td {
      padding: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      text-align: center;
    }

    #loaderOverlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
      color: white;
      font-size: 18px;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .spinner {
      border: 6px solid rgba(255,255,255,0.3);
      border-top: 6px solid white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loaderOverlay.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    #downloadPdfBtn {
      margin-top: 15px;
      background: #ffffff;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: none;
      font-weight: bold;
      color: #2193b0;
    }

    #downloadPdfBtn:hover {
      background: #e8e8e8;
    }
  </style>
</head>

<body>

  <!-- Loader -->
  <div id="loaderOverlay">
    <div class="spinner"></div>
    <p>Loading your profile...</p>
  </div>

  <!-- PROFILE CARD -->
  <div class="profile-card">
    <img id="profilePhoto" src="" alt="Profile Photo">
    <h2 id="studentName">Loading...</h2>
    <p id="batch"></p>

    <div class="live-test-window">
      <h3>Live Test Window</h3>
      <p id="currentTest">Fetching test data...</p>
    </div>

    <div class="previous-tests">
      <h3>Previous Tests</h3>
      <table id="previousTestsTable">
        <thead>
          <tr><th>Test Name</th><th>Marks</th><th>Date</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- FIXED: BUTTON ADDED -->
    <button id="downloadPdfBtn">Download PDF</button>
  </div>

  <!-- ==========================
       INTERNAL JS 
  =========================== -->
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const secretCode = urlParams.get('code');

    if (!secretCode) {
      alert("Invalid QR Code URL!");
    } else {
      fetch(`https://script.google.com/macros/s/AKfycbxAhc_CcYdlpZvqVu6oQc3Z1-_j_lw3YhVK5f5sjWNYpSSSyDksTopzypxekIZJsOjC/exec?code=${secretCode}`)
        .then(response => response.json())
        .then(data => {
          if (data.error) {
            alert(data.error);
            return;
          }

          function getDirectDriveLink(url) {
            if (!url) return "";
            let match = url.match(/[-\w]{25,}/);
            return match ? `https://drive.google.com/uc?export=view&id=${match[0]}` : url;
          }

          // Fill Data
          document.getElementById('studentName').innerText = data.student.name;
          document.getElementById('batch').innerText = "Batch: " + data.student.batch;
          document.getElementById('profilePhoto').src =
            getDirectDriveLink(data.student.profilePhoto) ||
            "https://via.placeholder.com/120?text=No+Photo";

          // Current test
          document.getElementById('currentTest').innerText =
            data.currentTest
              ? `${data.currentTest.testName} - ${data.currentTest.marks} Marks (${data.currentTest.date})`
              : "No Current Test.";

          // Previous tests
          const body = document.querySelector("#previousTestsTable tbody");
          body.innerHTML = "";
          data.previousTests.forEach(t => {
            body.innerHTML += `<tr>
              <td>${t.testName}</td>
              <td>${t.marks}</td>
              <td>${t.date}</td>
            </tr>`;
          });

          // Show Card + Hide Loader
          document.getElementById('loaderOverlay').classList.add('fade-out');
          document.querySelector('.profile-card').style.display = 'block';

          // PDF Button Logic
          const pdfBtn = document.getElementById("downloadPdfBtn");
          pdfBtn.style.display = "inline-block";

          pdfBtn.onclick = () => {
            fetch("https://script.google.com/macros/s/AKfycbx55WA06bJ1L_pGv3UIH2-kEw5BooDyF-6TDoZt7hBTr5kUIwkfWuZcSFCCl17syDoFkQ/exec", {
              method: "POST",
              body: JSON.stringify(data),
              headers: { "Content-Type": "application/json" }
            })
              .then(r => r.json())
              .then(pdf => {
                if (pdf.error) alert(pdf.error);
                else window.open(pdf.pdfUrl, "_blank");
              })
              .catch(() => alert("PDF generation failed"));
          };
        })
        .catch(() => alert("Failed to fetch profile data."));
    }
  </script>

</body>
</html>
